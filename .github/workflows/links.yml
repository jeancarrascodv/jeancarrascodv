# The README is mostly third-party widgets, and those hosts die quietly: the
# streak card pointed at a Heroku instance that had been gone for months and
# the profile just showed a broken image. This checks every URL weekly and
# opens an issue when one stops answering.
name: links

# Schedule and manual only, no push trigger: the README points at SVGs that
# the snake and metrics workflows generate on that same push, so running here
# would check them before they exist and report four 404s that are not real.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every link and badge
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn answers bots with 999 and the counters rate-limit under
          # CI, so they are excluded to keep the signal honest.
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --accept 200,429
            --exclude linkedin\.com
            --exclude komarev\.com
            README.md
          fail: false
          output: lychee/out.md

      - name: Open an issue if something broke
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: A link or badge in the profile README stopped answering
          content-filepath: lychee/out.md
          labels: broken-link
